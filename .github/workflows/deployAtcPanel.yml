name: Deploy To cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cpanel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, pdo_mysql, zip, gd, xml

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Deploy project files over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftp.aghslahore.pk
          username: aghslahore@aghslahore.pk
          password: ie5Na&]TNH[jUEO8
          protocol: ftp
          port: 21
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/test-results/**
            **/playwright-report/**
            **/storage/logs/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/*.php
            **/storage/framework/views/*.php
            **/.env
            **/.env.*
            **/phpunit.xml
            **/README.md
